<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Local browser for a 3D print model library: walk the folder tree, filter projects and reveal them in your file manager."
    />
    <title>3D Print Catalog</title>
    <script>
      // The theme follows the operating system: the stylesheet ships a light
      // `:root` and a `.dark` variant, so the class is kept in sync here. It runs
      // in the head, before the first paint, to avoid a flash of the wrong theme.
      const scheme = window.matchMedia('(prefers-color-scheme: dark)')
      const applyScheme = () => document.documentElement.classList.toggle('dark', scheme.matches)

      applyScheme()
      scheme.addEventListener('change', applyScheme)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
